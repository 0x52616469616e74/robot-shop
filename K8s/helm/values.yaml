image:
  repo: robotshop
  version: latest
  pullPolicy: IfNotPresent

nodeport: false
openshift: false
ocCreateRoute: false

monitoring:
  enabled: true
  prometheusRelease: monitoring

loadGenerator:
  enabled: true
  image: robotshop/rs-load:latest
  clients: 15
  errors: 1

######################################
# Affinities for individual workloads
# set in the following way:
# <workload>:
#   affinity: {}
#   nodeSelector: {}
#   tolerations: []
######################################

cart: {}

catalogue: {}

dispatch: {}

mongodb: {}

mysql: {}

payment:
  image:
    repository: ghcr.io/0x52616469616e74/robot-shop-payment
    tag: main
  otelEndpoint: http://jaeger.observability.svc.cluster.local:4318/v1/traces
  # Alternative payment gateway URL
  # Default is https://www.paypal.com
  gateway: null
  #gateway: https://www.worldpay.com

rabbitmq:
  image: rabbitmq:4.2.4-management-alpine

ratings: {}

redis:
  # Storage class to use with redis statefulset.
  storageClassName: gp2
  image: redis:8.4.7-alpine3.22
  persistence:
    enabled: true

shipping:
  # The image runs java -Xmx768m; heap plus metaspace and thread stacks
  # exceed 1000Mi under load (OOMKilled), and 200m CPU starves the JVM.
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 200m
      memory: 1Gi

user: {}

web: {}
