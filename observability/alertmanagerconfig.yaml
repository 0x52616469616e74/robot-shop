apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: robot-shop-slack
  namespace: observability
  labels:
    alertmanagerConfig: robot-shop
spec:
  route:
    receiver: robot-shop-slack
    groupBy: [alertname, service]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 2h
    matchers:
      - name: service
        value: payment
        matchType: "="
  receivers:
    - name: robot-shop-slack
      slackConfigs:
        - apiURL:
            name: alertmanager-slack
            key: webhook-url
          channel: "#robot-shop-alerts"
          sendResolved: true
          title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
          text: "{{ range .Alerts }}{{ .Annotations.description }}\nRunbook: {{ .Annotations.runbook_url }}{{ end }}"
